services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jeegit
      POSTGRES_USER: jeegit
      POSTGRES_PASSWORD: jeegit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jeegit"]
      interval: 5s
      timeout: 3s
      retries: 20

  jeegit:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      JEEGIT_DB_URL: jdbc:postgresql://postgres:5432/jeegit
      JEEGIT_DB_USER: jeegit
      JEEGIT_DB_PASSWORD: jeegit
      JEEGIT_SECURITY_ADMIN_USERNAME: admin
      JEEGIT_SECURITY_ADMIN_PASSWORD: changeme
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata: {}

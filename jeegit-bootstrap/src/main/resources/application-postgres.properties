spring.application.name=jeegit

# --- PostgreSQL ---
spring.datasource.url=${JEEGIT_DB_URL:jdbc:postgresql://localhost:5432/jeegit}
spring.datasource.username=${JEEGIT_DB_USER:jeegit}
spring.datasource.password=${JEEGIT_DB_PASSWORD:jeegit}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA: schema managed by Flyway, not Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.messages.encoding=UTF-8

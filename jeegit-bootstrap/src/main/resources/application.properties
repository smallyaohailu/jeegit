spring.application.name=jeegit
server.port=8080

# --- H2 (preview) ---
spring.datasource.url=jdbc:h2:mem:jeegit;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false

# --- i18n ---
spring.messages.encoding=UTF-8

# --- Security (change in production) ---
jeegit.security.admin-username=admin
jeegit.security.admin-password=admin

# --- Rate limiting ---
jeegit.rate-limit.enabled=true
jeegit.rate-limit.permits-per-minute=300

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.tags.application=${spring.application.name}
management.tracing.sampling.probability=1.0
management.endpoint.health.show-details=always

# --- OpenAPI / Swagger UI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.show-actuator=false
